<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <title>Dhamma Studio - Interactive Live Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'NamKhone';
      src: url('/static/fonts/NamKhone Grand (2).ttf'), url('/static/fonts/NamKhone Grand.ttf'), url('/fonts/NamKhone Grand.ttf');
    }
    .font-mm { font-family: 'NamKhone', sans-serif; }
    .text-stroke {
      text-shadow:
        -2.5px -2.5px 0 #000,
         2.5px -2.5px 0 #000,
        -2.5px  2.5px 0 #000,
         2.5px  2.5px 0 #000,
        -3.5px 0 0 #000,
         3.5px 0 0 #000,
         0 -3.5px 0 #000,
         0  3.5px 0 #000;
    }
    .viewport-landscape { width: 100%; aspect-ratio: 16/9; }
    .viewport-mobile { height: 100%; max-height: 480px; aspect-ratio: 9/16; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 flex flex-col h-screen overflow-hidden select-none">

  <!-- Header -->
  <header class="h-14 border-b border-slate-800 bg-[#111827] px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">☸</div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">Dhamma Studio</h1>
        <p class="text-[10px] text-slate-400">4-Line Punctuation Splitting • Live Background Sync</p>
      </div>
    </div>

    <!-- Format Switcher & Progress Bar -->
    <div class="flex items-center gap-4">
      <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
        <button id="btn-fmt-landscape" onclick="switchVideoFormat('landscape')" class="px-3 py-1 rounded bg-indigo-600 font-semibold text-white">16:9 Landscape</button>
        <button id="btn-fmt-mobile" onclick="switchVideoFormat('mobile')" class="px-3 py-1 rounded text-slate-400 hover:text-white">9:16 Mobile Shorts</button>
      </div>

      <div class="flex items-center gap-3 bg-slate-900 border border-slate-800 px-4 py-1.5 rounded-full w-80">
        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
          <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300 w-0"></div>
        </div>
        <span id="progress-text" class="text-xs font-mono text-indigo-400 shrink-0">Ready</span>
      </div>
    </div>
  </header>

  <!-- Workspace -->
  <main class="flex-1 flex overflow-hidden p-4 gap-4">

    <!-- LEFT: Viewport & Visual Toolbar -->
    <section class="flex-[1.15] flex flex-col gap-3">
      
      <!-- Video Viewport -->
      <div class="flex-1 bg-black rounded-2xl border border-slate-800 relative overflow-hidden flex items-center justify-center shadow-2xl p-2">
        <div id="video-viewport" class="viewport-landscape relative overflow-hidden rounded-xl border border-slate-800 flex items-center justify-center bg-slate-950">
          
          <!-- Blurred Background for Mobile View -->
          <img id="canvas-bg-blur" class="absolute inset-0 w-full h-full object-cover filter blur-md brightness-50 z-0 hidden" alt="Blurred BG">
          
          <!-- Center Banner Frame (Only for Mobile 9:16) -->
          <div id="mobile-center-banner" class="absolute inset-x-0 h-48 border-y border-white/20 overflow-hidden z-10 hidden flex items-center justify-center">
            <img id="canvas-bg-center" class="w-full h-full object-cover" alt="Sharp Banner">
            <div class="absolute inset-0 bg-black/25"></div>
          </div>

          <!-- Standard Landscape Background -->
          <img id="canvas-bg" class="absolute inset-0 w-full h-full object-cover z-0 hidden" alt="Background">
          <div id="canvas-dimmer" class="absolute inset-0 bg-[#00000073] z-10 transition-colors pointer-events-none"></div>
          <img id="logo-preview" class="absolute top-4 right-5 w-10 h-10 object-contain z-30 hidden" alt="Logo">
          
          <!-- Live Caption (1:1 with Render Output) -->
          <div id="canvas-text" 
               contenteditable="true" 
               oninput="syncCanvasToMemory()" 
               class="font-mm text-stroke z-30 text-center text-white leading-relaxed font-semibold tracking-wide drop-shadow-lg outline-none cursor-text select-text whitespace-pre-line px-6">
            (တင်သွင်းထားသော တရားတော်စာသား ဤနေရာတွင် ပေါ်ပါမည်)
          </div>
        </div>
      </div>

      <!-- In-Canvas Word Styler Toolbar -->
      <div class="bg-slate-900/90 border border-slate-800 px-4 py-2.5 rounded-xl flex items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-3">
          <span class="text-[11px] font-bold text-indigo-400 uppercase">Word Styler:</span>
          <button onclick="applyBoxStyle()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-md font-semibold">Highlight Box</button>
          <input type="color" id="tool-box-bg" value="#8c4e12" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">
          <input type="color" id="tool-box-bc" value="#ffffff" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">

          <div class="h-4 w-px bg-slate-800"></div>

          <button onclick="applyOutlineStyle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md font-semibold">Outline</button>
          <input type="color" id="tool-outline-c" value="#000000" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">

          <button onclick="clearSelectedStyle()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-md">✕ Clear</button>
        </div>

        <div class="flex items-center gap-3">
          <label class="text-slate-400 text-[11px]">Font Size:</label>
          <input type="number" id="gen-font-size" value="48" min="20" max="72" onchange="adjustFontSettings()" class="w-12 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-center text-xs">
          
          <label class="text-slate-400 text-[11px]">Spacing:</label>
          <input type="number" id="gen-line-spacing" value="26" min="10" max="60" onchange="adjustFontSettings()" class="w-12 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-center text-xs">
          
          <label class="text-slate-400 text-[11px]">Dimmer:</label>
          <input type="range" id="gen-opacity" min="0" max="90" value="45" oninput="adjustDimmer(this.value)" class="w-16">
        </div>
      </div>

      <!-- Audio Controller -->
      <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <button id="btn-play" onclick="togglePlay()" class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition">
            ▶ Play (Space)
          </button>
          <span id="clock" class="font-mono text-sm text-emerald-400 bg-emerald-950/60 border border-emerald-800/80 px-3 py-1 rounded-md">
            00:00.00
          </span>
        </div>
        <audio id="audio-elem" class="hidden"></audio>
        <button onclick="stampNext()" class="px-5 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs transition">
          ↵ Split & Stamp Next (Enter)
        </button>
      </div>

    </section>

    <!-- RIGHT: Timeline Chunks, Inline Editors & Delete Action -->
    <section class="flex-1 flex flex-col gap-3 overflow-hidden">
      
      <!-- Upload Card -->
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex flex-col gap-2.5 shrink-0">
        <div class="grid grid-cols-3 gap-2">
          <input type="file" id="input-audio" accept="audio/*" class="hidden" onchange="onFileChosen('audio')">
          <button onclick="document.getElementById('input-audio').click()" id="btn-audio-choose" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded-lg border border-slate-700 text-slate-200 truncate">
            🎵 1. Audio (.mp3)
          </button>

          <input type="file" id="input-text" accept=".txt" class="hidden" onchange="onFileChosen('text')">
          <button onclick="document.getElementById('input-text').click()" id="btn-text-choose" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded-lg border border-slate-700 text-slate-200 truncate">
            📝 2. Text (.txt)
          </button>

          <input type="file" id="input-logo" accept="image/*" class="hidden" onchange="onFileChosen('logo')">
          <button onclick="document.getElementById('input-logo').click()" id="btn-logo-choose" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded-lg border border-slate-700 text-slate-200 truncate">
            🏷️ 3. Logo (Opt)
          </button>
        </div>

        <div class="flex gap-2">
          <input type="file" id="input-folder" webkitdirectory directory multiple class="hidden" onchange="uploadImageFolder()">
          <button onclick="document.getElementById('input-folder').click()" id="btn-folder-choose" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 px-3 rounded-lg text-slate-200 border border-slate-700 truncate">
            📁 Upload Images Folder
          </button>
          <button onclick="uploadAndSync()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-4 py-2 rounded-lg text-white font-semibold">⚡ Auto-Segment</button>
        </div>
      </div>

      <!-- Segment Timeline List -->
      <div class="flex-1 bg-slate-900/40 border border-slate-800 rounded-xl flex flex-col overflow-hidden p-3">
        <div class="flex justify-between items-center mb-2 px-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Segments</span>
            <span id="segment-count" class="text-xs text-indigo-400 font-mono">0 Chunks</span>
          </div>

          <!-- Shift Shifter -->
          <div class="flex items-center gap-1.5 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">
            <span class="text-[10px] text-slate-400">Shift All:</span>
            <button onclick="shiftAllTimestamps(-1.0)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-amber-400">-1s</button>
            <button onclick="shiftAllTimestamps(-0.5)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-amber-400">-0.5s</button>
            <button onclick="shiftAllTimestamps(0.5)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-emerald-400">+0.5s</button>
            <button onclick="shiftAllTimestamps(1.0)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-emerald-400">+1s</button>
            <button onclick="shiftAllTimestamps(4.0)" class="bg-indigo-600 hover:bg-indigo-500 text-[10px] px-2 py-0.5 rounded text-white font-bold" title="Chunk 1 မှစ၍ ၄ စက္ကန့် နောက်ဆုတ်မည်">+4s Delay</button>
          </div>
        </div>
        <div id="segment-list" class="flex-1 overflow-y-auto space-y-1 pr-1"></div>
      </div>

      <!-- Render Action Button with BGM Checkbox -->
      <div class="flex items-center gap-3 shrink-0">
        <label class="flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-2.5 rounded-xl cursor-pointer hover:bg-slate-800/80 transition text-xs shrink-0 select-none">
          <input type="checkbox" id="check-enable-bgm" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer">
          <span class="text-slate-200 font-medium">🎵 Intro BGM</span>
        </label>

        <button onclick="startRender()" class="flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 py-3 rounded-xl font-bold text-xs shadow-lg shadow-indigo-600/30">
          🎬 Render Complete Video (FFmpeg)
        </button>
        <button id="btn-download" onclick="downloadVideo()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-3 rounded-xl font-bold text-xs text-white hidden">
          ⬇ Download Video
        </button>
      </div>

    </section>

  </main>

  <script>
    let rows = [];
    let currentIndex = 0;
    let currentFormat = "landscape";
    const audioElem = document.getElementById('audio-elem');

    setInterval(async () => {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('progress-bar').style.width = `${data.pct}%`;
        document.getElementById('progress-text').innerText = `${data.pct}% - ${data.msg}`;
        if (data.pct === 100 && !data.is_rendering && rows.length > 0) {
          const dlBtn = document.getElementById('btn-download');
          if (dlBtn && dlBtn.classList.contains('hidden')) {
            dlBtn.classList.remove('hidden');
          }
        }
      } catch (err) {}
    }, 1000);

    function switchVideoFormat(fmt) {
      currentFormat = fmt;
      const viewport = document.getElementById('video-viewport');
      const btnLand = document.getElementById('btn-fmt-landscape');
      const btnMob = document.getElementById('btn-fmt-mobile');
      const fontIn = document.getElementById('gen-font-size');
      const spaceIn = document.getElementById('gen-line-spacing');
      const bgBlur = document.getElementById('canvas-bg-blur');
      const centerBanner = document.getElementById('mobile-center-banner');
      const standardBg = document.getElementById('canvas-bg');

      if (fmt === 'mobile') {
        viewport.className = "viewport-mobile relative overflow-hidden rounded-xl border border-slate-800 flex items-center justify-center bg-slate-950";
        btnMob.className = "px-3 py-1 rounded bg-indigo-600 font-semibold text-white";
        btnLand.className = "px-3 py-1 rounded text-slate-400 hover:text-white";
        fontIn.value = 40;
        spaceIn.value = 22;

        standardBg.classList.add('hidden');
        bgBlur.classList.remove('hidden');
        centerBanner.classList.remove('hidden');
      } else {
        viewport.className = "viewport-landscape relative overflow-hidden rounded-xl border border-slate-800 flex items-center justify-center bg-slate-950";
        btnLand.className = "px-3 py-1 rounded bg-indigo-600 font-semibold text-white";
        btnMob.className = "px-3 py-1 rounded text-slate-400 hover:text-white";
        fontIn.value = 48;
        spaceIn.value = 26;

        bgBlur.classList.add('hidden');
        centerBanner.classList.add('hidden');
        standardBg.classList.remove('hidden');
      }
      adjustFontSettings();
      if (rows.length > 0) selectSegment(currentIndex);
    }

    function onFileChosen(type) {
      const input = document.getElementById(`input-${type}`);
      const btn = document.getElementById(`btn-${type}-choose`);
      if (input.files[0]) {
        btn.innerText = `✓ ${input.files[0].name}`;
        btn.classList.add('border-emerald-600', 'text-emerald-400');
      }
    }

    async function uploadImageFolder() {
      const folderInput = document.getElementById('input-folder');
      const files = folderInput.files;
      if (!files || files.length === 0) return;

      const btn = document.getElementById('btn-folder-choose');
      btn.innerText = `⏳ Uploading ${files.length} images...`;

      const formData = new FormData();
      for (let i = 0; i < files.length; i++) {
        formData.append('files', files[i]);
      }

      const res = await fetch('/api/upload_images_folder', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) {
        btn.innerText = `✓ ${data.count} Images Uploaded`;
        btn.classList.add('border-emerald-600', 'text-emerald-400');
      }
    }

    async function uploadAndSync() {
      const audioInput = document.getElementById('input-audio');
      const textInput = document.getElementById('input-text');
      const logoInput = document.getElementById('input-logo');

      if (!audioInput.files || !audioInput.files[0] || !textInput.files || !textInput.files[0]) {
        alert("Audio (.mp3) နှင့် Text (.txt) ဖိုင် နှစ်ခုလုံးကို အရင်ရွေးချယ်ပေးပါ။");
        return;
      }

      const formData = new FormData();
      formData.append('audio', audioInput.files[0]);
      formData.append('text', textInput.files[0]);
      if (logoInput.files && logoInput.files[0]) {
        formData.append('logo', logoInput.files[0]);
      }

      const res = await fetch('/api/upload_assets', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) {
        rows = data.rows;
        audioElem.src = data.audio_url;
        document.getElementById('segment-count').innerText = `${rows.length} Chunks`;

        if (data.has_logo) {
          const logoEl = document.getElementById('logo-preview');
          logoEl.src = '/api/get_logo';
          logoEl.classList.remove('hidden');
        }

        renderTimeline();
        selectSegment(0);
      } else {
        alert(data.error);
      }
    }

    async function shiftAllTimestamps(offsetSec) {
      if (!rows || rows.length === 0) return;
      const res = await fetch('/api/shift_all_timestamps', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ offset_sec: offsetSec })
      });
      const data = await res.json();
      if (data.success) {
        rows = data.rows;
        renderTimeline();
        selectSegment(currentIndex);
      }
    }

    async function insertNewRow(afterIdx, event) {
      event.stopPropagation();
      const res = await fetch('/api/insert_row', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ after_index: afterIdx })
      });
      const data = await res.json();
      if (data.success) {
        rows = data.rows;
        document.getElementById('segment-count').innerText = `${rows.length} Chunks`;
        renderTimeline();
        selectSegment(data.inserted_index);
      }
    }

    async function deleteSegment(idx, event) {
      event.stopPropagation();
      if (!confirm(`Segment #${idx + 1} ကို ဖျက်ရန် သေချာပါသလား?`)) return;

      const res = await fetch('/api/delete_row', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ index: idx })
      });
      const data = await res.json();
      if (data.success) {
        rows = data.rows;
        document.getElementById('segment-count').innerText = `${rows.length} Chunks`;
        if (currentIndex >= rows.length) currentIndex = Math.max(0, rows.length - 1);
        renderTimeline();
        if (rows.length > 0) selectSegment(currentIndex);
      }
    }

    async function updateSegmentTime(idx, field, val) {
      const num = parseFloat(val);
      if (isNaN(num)) return;
      rows[idx][field] = num;
      rows[idx].duration = Math.round(Math.max(0, rows[idx].end_time - rows[idx].start_time) * 100) / 100;
      
      await fetch('/api/update_row', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rows[idx])
      });
    }

    function renderTimeline() {
      const container = document.getElementById('segment-list');
      container.innerHTML = "";
      rows.forEach((r, idx) => {
        const wrapDiv = document.createElement('div');
        wrapDiv.className = "flex flex-col";

        const item = document.createElement('div');
        item.className = `p-2.5 rounded-lg border text-xs cursor-pointer transition flex items-center justify-between gap-2.5 ${
          idx === currentIndex ? 'bg-indigo-950/80 border-indigo-500 shadow-md' : 'bg-slate-950 border-slate-800 hover:border-slate-700'
        }`;
        item.onclick = () => selectSegment(idx);

        const cleanTxt = r.caption.replace(/<[^>]+>/g, '').replace(/\n/g, ' ');

        item.innerHTML = `
          <span class="font-mono text-[10px] text-indigo-400 font-bold w-5 shrink-0">#${idx + 1}</span>
          <div class="flex-1 truncate font-mm text-slate-200">${cleanTxt}</div>
          
          <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
            <input type="number" step="0.1" value="${r.start_time}" 
              onchange="updateSegmentTime(${idx}, 'start_time', this.value)"
              class="w-14 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 font-mono text-[11px] text-emerald-400 text-center focus:border-indigo-500 outline-none">
            <span class="text-slate-600">-</span>
            <input type="number" step="0.1" value="${r.end_time}" 
              onchange="updateSegmentTime(${idx}, 'end_time', this.value)"
              class="w-14 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 font-mono text-[11px] text-amber-400 text-center focus:border-indigo-500 outline-none">
          </div>

          <button onclick="deleteSegment(${idx}, event)" class="text-slate-500 hover:text-red-400 p-1 transition shrink-0" title="Delete Segment">
            🗑️
          </button>
        `;
        wrapDiv.appendChild(item);

        const divider = document.createElement('div');
        divider.className = "relative flex items-center justify-center h-4 group cursor-pointer my-0.5";
        divider.title = "Insert New Split Row Here";
        divider.innerHTML = `
          <div class="w-full h-px bg-transparent group-hover:bg-indigo-500/50 transition"></div>
          <button onclick="insertNewRow(${idx}, event)" 
                  class="absolute opacity-0 group-hover:opacity-100 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow-lg transition transform group-hover:scale-110">
            +
          </button>
        `;
        wrapDiv.appendChild(divider);

        container.appendChild(wrapDiv);
      });
    }

    function adjustFontSettings() {
      const sz = parseInt(document.getElementById('gen-font-size').value) || 48;
      const sp = parseInt(document.getElementById('gen-line-spacing').value) || 26;
      const el = document.getElementById('canvas-text');

      if (currentFormat === 'mobile') {
        const previewSz = Math.max(11, Math.round(sz * 0.28));
        const previewSp = Math.max(4, Math.round(sp * 0.28));
        el.style.fontSize = `${previewSz}px`;
        el.style.lineHeight = `${previewSz + previewSp + 4}px`;
        el.style.maxWidth = '250px';
      } else {
        el.style.fontSize = '24px';
        el.style.lineHeight = '38px';
        el.style.maxWidth = '90%';
      }
    }

    function selectSegment(idx) {
      if (!rows || rows.length === 0) return;
      currentIndex = idx;
      renderTimeline();
      const r = rows[idx];
      const canvasText = document.getElementById('canvas-text');
      canvasText.innerText = r.caption;
      audioElem.currentTime = r.start_time;

      const canvasBg = document.getElementById('canvas-bg');
      const canvasBgBlur = document.getElementById('canvas-bg-blur');
      const canvasBgCenter = document.getElementById('canvas-bg-center');

      if (r.matched_img) {
        canvasBg.src = r.matched_img;
        canvasBgBlur.src = r.matched_img;
        canvasBgCenter.src = r.matched_img;

        if (currentFormat === 'mobile') {
          canvasBg.classList.add('hidden');
          canvasBgBlur.classList.remove('hidden');
          document.getElementById('mobile-center-banner').classList.remove('hidden');
        } else {
          canvasBg.classList.remove('hidden');
          canvasBgBlur.classList.add('hidden');
          document.getElementById('mobile-center-banner').classList.add('hidden');
        }
      } else {
        canvasBg.classList.add('hidden');
        canvasBgBlur.classList.add('hidden');
        document.getElementById('mobile-center-banner').classList.add('hidden');
      }

      adjustFontSettings();
    }

    function syncCanvasToMemory() {
      if (!rows[currentIndex]) return;
      rows[currentIndex].caption = document.getElementById('canvas-text').innerText;
      fetch('/api/update_row', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rows[currentIndex])
      });
    }

    function applyBoxStyle() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const text = selection.toString();
      if (!text.trim()) return;

      const bg = document.getElementById('tool-box-bg').value;
      const bc = document.getElementById('tool-box-bc').value;

      const span = document.createElement('span');
      span.setAttribute('data-style', 'box');
      span.setAttribute('data-bg', bg);
      span.setAttribute('data-bc', bc);
      span.style.backgroundColor = bg;
      span.style.border = `2px solid ${bc}`;
      span.style.padding = '2px 8px';
      span.style.borderRadius = '4px';
      span.textContent = text;

      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(span);
      syncCanvasToMemory();
    }

    function applyOutlineStyle() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const text = selection.toString();
      if (!text.trim()) return;

      const c = document.getElementById('tool-outline-c').value;
      const span = document.createElement('span');
      span.setAttribute('data-style', 'outline');
      span.setAttribute('data-w', '4');
      span.setAttribute('data-c', c);
      span.style.textShadow = `-2px -2px 0 ${c}, 2px -2px 0 ${c}, -2px 2px 0 ${c}, 2px 2px 0 ${c}`;
      span.textContent = text;

      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(span);
      syncCanvasToMemory();
    }

    function clearSelectedStyle() {
      const el = document.getElementById('canvas-text');
      el.innerHTML = el.innerText;
      syncCanvasToMemory();
    }

    function adjustDimmer(val) {
      document.getElementById('canvas-dimmer').style.backgroundColor = `rgba(0, 0, 0, ${val / 100})`;
    }

    function togglePlay() {
      const btn = document.getElementById('btn-play');
      if (audioElem.paused) {
        audioElem.play();
        btn.innerText = "⏸ Pause";
        btn.className = "px-5 py-2 rounded-lg bg-amber-600 text-white font-semibold text-xs";
      } else {
        audioElem.pause();
        btn.innerText = "▶ Play (Space)";
        btn.className = "px-5 py-2 rounded-lg bg-emerald-600 text-white font-semibold text-xs";
      }
    }

    audioElem.ontimeupdate = () => {
      const sec = audioElem.currentTime;
      const mins = Math.floor(sec / 60);
      const rem = (sec % 60).toFixed(2);
      document.getElementById('clock').innerText = `${String(mins).padStart(2, '0')}:${String(rem).padStart(5, '0')}`;

      if (rows[currentIndex] && sec >= rows[currentIndex].end_time && currentIndex < rows.length - 1) {
        selectSegment(currentIndex + 1);
      }
    };

    async function stampNext() {
      if (!rows[currentIndex]) return;
      const cur = audioElem.currentTime;
      rows[currentIndex].end_time = parseFloat(cur.toFixed(2));
      
      await fetch('/api/update_row', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rows[currentIndex])
      });

      if (currentIndex < rows.length - 1) {
        rows[currentIndex + 1].start_time = parseFloat(cur.toFixed(2));
        selectSegment(currentIndex + 1);
      }
    }

    async function startRender() {
      const formData = new FormData();
      formData.append('format', currentFormat);
      formData.append('font_size', document.getElementById('gen-font-size').value);
      formData.append('line_spacing', document.getElementById('gen-line-spacing').value);
      formData.append('opacity', document.getElementById('gen-opacity').value);
      formData.append('enable_bgm', document.getElementById('check-enable-bgm').checked);

      const res = await fetch('/api/start_render', { method: 'POST', body: formData });
      const data = await res.json();
      if (!data.success) alert(data.error);
    }

    function downloadVideo() {
      window.location.href = '/api/download_video';
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.id !== 'canvas-text' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
      if (e.code === 'Enter' && e.target.id !== 'canvas-text' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        stampNext();
      }
    });
  </script>
</body>
</html>
